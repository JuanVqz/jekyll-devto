name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keeps a "chore(main): release x.y.z" pull request open with the version
  # bump and CHANGELOG built from Conventional Commits. Merging it tags the
  # release and creates the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Pushes the gem with trusted publishing: the job's OIDC token is exchanged
  # for a short-lived RubyGems key, so there is no secret in the repo and no
  # MFA code to type. The publisher is registered on rubygems.org.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem build jekyll-devto.gemspec
      - run: gem push jekyll-devto-*.gem
